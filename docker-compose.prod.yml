version: "3.9"

services:
  api:
    image: ${REGISTRY}/leadforge-api:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    ports:
      - "8000:8000"
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3

  worker:
    image: ${REGISTRY}/leadforge-worker:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env.production
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
